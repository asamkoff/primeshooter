name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and create tag
        id: version
        shell: bash
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const { execFileSync } = require("node:child_process");

          function git(args) {
            return execFileSync("git", args, { encoding: "utf8" }).trim();
          }

          function parseVersion(tag) {
            const match = /^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.exec(tag);
            return match ? match.slice(1).map(Number) : null;
          }

          function compareVersions(left, right) {
            for (let index = 0; index < 3; index += 1) {
              if (left[index] !== right[index]) return right[index] - left[index];
            }
            return 0;
          }

          const sha = process.env.GITHUB_SHA;
          const remoteMain = git(["ls-remote", "origin", "refs/heads/main"]).split(/\s+/)[0];
          if (!remoteMain) throw new Error("Could not read the remote main branch.");
          if (remoteMain !== sha) {
            console.log("A newer commit is on main; skipping this outdated deployment.");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, "deploy=false\n");
            process.exit(0);
          }

          const validTags = git(["tag", "--list", "v[0-9]*"])
            .split(/\r?\n/)
            .map((tag) => ({ tag, version: parseVersion(tag) }))
            .filter((entry) => entry.version !== null)
            .sort((left, right) => compareVersions(left.version, right.version));

          const existingTag = git(["tag", "--points-at", sha])
            .split(/\r?\n/)
            .map((tag) => ({ tag, version: parseVersion(tag) }))
            .filter((entry) => entry.version !== null)
            .sort((left, right) => compareVersions(left.version, right.version))[0];

          let version;
          let tag;
          if (existingTag) {
            version = existingTag.version;
            tag = existingTag.tag;
            console.log(`Reusing ${tag} for this commit.`);
          } else {
            const commits = require(process.env.GITHUB_EVENT_PATH).commits || [];
            const bumpRank = { patch: 1, minor: 2, major: 3 };
            const bumpName = { 1: "patch", 2: "minor", 3: "major" };
            let bump = 1;
            for (const commit of commits) {
              for (const match of commit.message.matchAll(/\[(major|minor|patch)\]/gi)) {
                bump = Math.max(bump, bumpRank[match[1].toLowerCase()]);
              }
            }

            const latest = validTags[0];
            version = latest ? latest.version.slice() : [0, 0, 0];
            if (bump === 3) {
              version = [version[0] + 1, 0, 0];
            } else if (bump === 2) {
              version = [version[0], version[1] + 1, 0];
            } else {
              version[2] += 1;
            }

            tag = `v${version.join(".")}`;
            git(["tag", "-a", tag, sha, "-m", `Release ${tag}`]);
            git(["push", "origin", tag]);
            console.log(`Created ${tag} using a ${bumpName[bump]} bump.`);
          }

          const versionString = version.join(".");
          fs.writeFileSync(
            "version.json",
            `${JSON.stringify({ version: versionString }, null, 2)}\n`
          );
          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `deploy=true\nversion=${versionString}\n`
          );
          NODE

      - name: Set up GitHub Pages
        if: steps.version.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        if: steps.version.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        if: steps.version.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
