<div class="wideItem">
<h1 class="game-title">PrimeShooter<sup><small>TM</small></sup></h1>
<div class="date game-date">22 March 2010</div>

<p class="rotate-message" role="status">Rotate your phone to landscape to play.</p>

<div id="gameLayout" class="game-layout">
  <div class="thumb-buffer">
    <div class="move-control" role="group" aria-label="Move player">
      <button id="moveLeft" class="move-button" type="button" aria-label="Move left">←</button>
      <button id="moveRight" class="move-button" type="button" aria-label="Move right">→</button>
    </div>
  </div>
  <div id="gameViewport" class="game-viewport">
    <div id="game"><!-- Game area -->
      <div id="score">Score: <span id="scoreValue">0</span></div><!-- Score display -->
      <div id="highScore">(No highscore)</div>

      <div id="gameOver"><!-- Game over message + restart button -->
        <div id="gameOverText">&nbsp;</div>
        <div id="startNewGameDiv"><input id="startNewGame" type="submit" value="Start New Game"/></div>
      </div>
      <div id="message">&nbsp;</div><!-- Message (when one gun is killed but game is not over) -->
      <div id="gun">&nbsp;</div><!-- Player's gun which shoots prime bullets -->
      <div id="bullet">nothing</div><!-- The bullet -->
      <div id="number0" class="number">number</div><!-- The numbers (up to 5 can be active) -->
      <div id="number1" class="number">number</div>
      <div id="number2" class="number">number</div>
      <div id="number3" class="number">number</div>
      <div id="number4" class="number">number</div>

      <div id="spareGuns"></div><!-- Spare gun display -->
    </div>
  </div>
  <div class="thumb-buffer">
    <button id="shootFive" class="shoot-control" type="button" aria-label="Shoot a number 5">5</button>
    <button id="shootThree" class="shoot-control" type="button" aria-label="Shoot a number 3">3</button>
    <button id="shootTwo" class="shoot-control" type="button" aria-label="Shoot a number 2">2</button>
  </div>
</div>

<section id="soundControls" class="sound-controls" aria-labelledby="soundControlsTitle">
  <div class="sound-controls-heading">
    <h2 id="soundControlsTitle">Shooting sound</h2>
    <button id="previewSound" type="button">Preview pew</button>
  </div>
  <div class="sound-settings">
    <label class="sound-setting" for="soundFrequency">
      <span>Oscillator frequency</span>
      <input id="soundFrequency" type="range" min="250" max="1200" step="10" value="700">
      <output id="soundFrequencyValue" for="soundFrequency">700 Hz</output>
    </label>
    <label class="sound-setting" for="soundEndFrequency">
      <span>Ending frequency</span>
      <input id="soundEndFrequency" type="range" min="80" max="500" step="10" value="180">
      <output id="soundEndFrequencyValue" for="soundEndFrequency">180 Hz</output>
    </label>
    <label class="sound-setting" for="soundDuration">
      <span>Duration</span>
      <input id="soundDuration" type="range" min="80" max="400" step="10" value="180">
      <output id="soundDurationValue" for="soundDuration">180 ms</output>
    </label>
    <label class="sound-setting" for="fadeInTime">
      <span>Fade-in time</span>
      <input id="fadeInTime" type="range" min="0" max="100" step="1" value="8">
      <output id="fadeInTimeValue" for="fadeInTime">8 ms</output>
    </label>
    <label class="sound-setting sound-waveform" for="soundWaveform">
      <span>Waveform</span>
      <select id="soundWaveform">
        <option value="sine">Sine</option>
        <option value="triangle" selected>Triangle</option>
        <option value="sawtooth">Sawtooth</option>
        <option value="square">Square</option>
      </select>
    </label>
  </div>
  <p id="soundStatus" class="sound-status" role="status" aria-live="polite"></p>
</section>

</div>
